# Local model weights, pinned by SHA-256. `scripts/setup_local_models.py` downloads each file
# (resumable), verifies the hash and registers it in Ollama under `ollama_name`.
# Weights go to $FLEMBENCH_GGUF_DIR (default data/external/gguf, gitignored).
#
# The original authors do not publish GGUFs, so these are community quantisations
# (mradermacher). Prompts are NOT formatted by the GGUF's embedded template: the harness renders
# each model's original chat template (config/chat_templates/, copied from the model card repo).

